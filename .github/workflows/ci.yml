name: CI Salesforce Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - 'force-app/**'
      - 'sfdx-project.json'
      - '.github/workflows/**'

concurrency:
  group: ci-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_INSTANCE_URL: https://login.salesforce.com
      SF_JWT_KEY_BASE64: ${{ secrets.SF_JWT_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        shell: bash
        run: |
          npm install -g @salesforce/cli
          sf version

      - name: Build uiBundle                          # ← NOVO
        shell: bash
        working-directory: force-app/main/default/uiBundles/EsquadraoMare
        run: |
          npm ci
          npm run build

      - name: Prepare JWT key
        shell: bash
        run: |
          echo "$SF_JWT_KEY_BASE64" | base64 --decode > server.key
          chmod 600 server.key
          test -s server.key

      - name: Validate private key
        shell: bash
        run: openssl pkey -in server.key -check -noout

      - name: Login with JWT
        shell: bash
        run: |
          sf org login jwt \
            --client-id    "$SF_CLIENT_ID" \
            --jwt-key-file server.key \
            --username     "$SF_USERNAME" \
            --instance-url "$SF_INSTANCE_URL" \
            --alias        ci-org \
            --set-default \
            --json

      - name: Cleanup JWT key
        if: always()
        shell: bash
        run: rm -f server.key

      - name: Validate auth session
        shell: bash
        run: sf org display --target-org ci-org --json

      - name: Validate metadata
        shell: bash
        run: |
          sf project deploy validate \
            --source-dir  force-app \
            --target-org  ci-org \
            --test-level  RunLocalTests \
            --wait        30 \
            --json