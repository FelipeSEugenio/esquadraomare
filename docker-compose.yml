services:
  app:
    build: .
    volumes:
      - .:/workspace
      - sf_config:/root/.sf
      - sfdx_config:/root/.sfdx
      - npm_cache:/root/.npm
    ports:
      - "5173:5173"
      - "5175:5175"
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    working_dir: /workspace/force-app/main/default/uiBundles/EsquadraoMare
    command: bash -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  sf_config:
  sfdx_config:
  npm_cache:
